name: Docker

on:
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  ALIYUN_REGISTRY: "${{ secrets.ALIYUN_REGISTRY }}"
  ALIYUN_NAME_SPACE: "${{ secrets.ALIYUN_NAME_SPACE }}"
  ALIYUN_REGISTRY_USER: "${{ secrets.ALIYUN_REGISTRY_USER }}"
  ALIYUN_REGISTRY_PASSWORD: "${{ secrets.ALIYUN_REGISTRY_PASSWORD }}"

jobs:
  build:
    name: Pull
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
    - name: Before freeing up disk space
      run: |
        echo "Before freeing up disk space"
        echo "=============================================================================="
        df -hT
        echo "=============================================================================="

    - name: Maximize build space
      uses: easimon/maximize-build-space@v10
      with:
        root-reserve-mb: 8192
        swap-size-mb: 128
        remove-dotnet: 'true'
        remove-haskell: 'true'
        remove-android: 'true'
        remove-codeql: 'true'
        remove-docker-images: 'true'
        remove-tool-cache: 'true'
        build-mount-path: '/var/lib/docker'

    - name: Clean root partition
      run: |
        echo "========== 清理前 =========="
        df -h /

        # ========== 预装语言运行时和工具链 ==========
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /opt/ghc
        sudo rm -rf /usr/lib/jvm
        sudo rm -rf /usr/local/go
        sudo rm -rf /usr/local/rvm
        sudo rm -rf /usr/local/.rustup
        sudo rm -rf /usr/local/cargo
        sudo rm -rf /usr/local/lib/node_modules
        sudo rm -rf /usr/local/lib/perl
        sudo rm -rf /opt/microsoft
        sudo rm -rf /usr/share/sbt

        # ========== Android / iOS / 移动开发 ==========
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /usr/local/share/vcpkg

        # ========== 工具缓存 ==========
        sudo rm -rf /opt/hostedtoolcache

        # ========== 浏览器 / 编辑器 ==========
        sudo rm -rf /usr/local/share/chromium
        sudo rm -rf /usr/local/share/powershell
        sudo rm -rf /usr/local/share/azcopy
        sudo rm -rf /usr/share/powershell
        sudo rm -rf /usr/share/azcopy

        # ========== Snap 包 ==========
        sudo rm -rf /snap

        # ========== 各种 CLI 工具 ==========
        sudo rm -rf /opt/az
        sudo rm -rf /opt/azcli
        sudo rm -rf /opt/cmake
        sudo rm -rf /opt/boost
        sudo rm -rf /usr/local/share/boost
        sudo rm -rf /usr/local/.ghcup
        sudo rm -rf /usr/local/share/CodeQL
        sudo rm -rf /usr/local/share/codeql
        sudo rm -rf /opt/CodeQL
        sudo rm -rf /opt/codeql

        # ========== 包管理缓存 ==========
        sudo rm -rf /var/lib/apt/lists/*
        sudo rm -rf /var/cache/apt/archives/*
        sudo rm -rf /var/cache/yum/*
        sudo rm -rf /root/.cache
        sudo rm -rf /home/runner/.cache

        # ========== 文档 / 帮助 / 本地化 ==========
        sudo rm -rf /usr/share/doc/*
        sudo rm -rf /usr/share/man/*
        sudo rm -rf /usr/share/locale/*
        sudo rm -rf /usr/share/i18n
        sudo rm -rf /usr/share/lintian
        sudo rm -rf /usr/share/linda
        sudo rm -rf /usr/share/gtk-doc

        # ========== 日志 ==========
        sudo rm -rf /var/log/*
        sudo journalctl --vacuum-size=10M

        # ========== 临时文件 ==========
        sudo rm -rf /tmp/*
        sudo rm -rf /var/tmp/*

        # ========== Docker 镜像缓存 ==========
        sudo docker system prune -af || true

        # ========== npm / pip / go 缓存 ==========
        sudo rm -rf /home/runner/.npm
        sudo rm -rf /home/runner/.pip
        sudo rm -rf /home/runner/.cache/pip
        sudo rm -rf /home/runner/go/pkg/mod
        sudo rm -rf /home/runner/.gradle
        sudo rm -rf /home/runner/.m2
        sudo rm -rf /home/runner/.nuget

        # ========== 查找剩余大文件 ==========
        echo "========== 查找剩余大文件 =========="
        sudo du -sh /usr/* 2>/dev/null | sort -rh | head -10
        sudo du -sh /opt/* 2>/dev/null | sort -rh | head -10
        sudo du -sh /var/* 2>/dev/null | sort -rh | head -10
        sudo du -sh /home/runner/* 2>/dev/null | sort -rh | head -10

        # ========== 清理后 ==========
        echo "========== 清理后 =========="
        df -h /
        echo "========== 完整报告 =========="
        df -hT

    - name: Restart docker
      run: sudo service docker restart

    - name: Free up disk space complete
      run: |
        echo "Free up disk space complete"
        echo "=============================================================================="
        df -hT
        echo "=============================================================================="

    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Docker Setup Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and push image Aliyun
      run: |
        set -euo pipefail

        echo "$ALIYUN_REGISTRY_PASSWORD" | docker login \
          -u "$ALIYUN_REGISTRY_USER" \
          --password-stdin "$ALIYUN_REGISTRY"

        # ===================== 第一遍：检测重名镜像 =====================
        declare -A duplicate_images
        declare -A temp_map

        while IFS= read -r line || [ -n "$line" ]; do
            [[ -z "${line// /}" ]] && continue
            if echo "$line" | grep -qE '^[ \t]*#'; then
                continue
            fi

            image=$(echo "$line" | awk '{print $NF}')
            image="${image%%@*}"
            echo "image: $image"

            image_name_tag=$(echo "$image" | awk -F'/' '{print $NF}')
            name_space=$(echo "$image" | awk -F'/' '{if (NF==3) print $2; else if (NF==2) print $1; else print ""}')
            name_space="${name_space}_"
            image_name=$(echo "$image_name_tag" | awk -F':' '{print $1}')

            if [[ -n "${temp_map[$image_name]:-}" ]]; then
                if [[ "${temp_map[$image_name]}" != "$name_space" ]]; then
                    echo "::warning::duplicate image name: $image_name"
                    duplicate_images[$image_name]="true"
                fi
            else
                temp_map[$image_name]=$name_space
            fi
        done < images.txt

        # ===================== 第二遍：拉取、打标签、推送 =====================
        pull_failed=0
        push_failed=0
        push_total=0

        while IFS= read -r line || [ -n "$line" ]; do
            [[ -z "${line// /}" ]] && continue
            if echo "$line" | grep -qE '^[ \t]*#'; then
                continue
            fi

            echo "=========================================="
            echo "docker pull $line"

            if ! timeout 600 docker pull "$line"; then
                echo "::error::Pull failed or timeout: $line"
                pull_failed=$((pull_failed + 1))
                continue
            fi

            platform=$(echo "$line" | awk -F'--platform[ =]' '{if (NF>1) print $2}' | awk '{print $1}')
            echo "platform: ${platform:-none}"

            if [ -z "$platform" ]; then
                platform_prefix=""
            else
                platform_prefix="${platform//\//_}_"
            fi

            image=$(echo "$line" | awk '{print $NF}')
            image_name_tag=$(echo "$image" | awk -F'/' '{print $NF}')
            name_space=$(echo "$image" | awk -F'/' '{if (NF==3) print $2; else if (NF==2) print $1; else print ""}')
            image_name=$(echo "$image_name_tag" | awk -F':' '{print $1}')

            name_space_prefix=""
            if [[ -n "${duplicate_images[$image_name]:-}" ]]; then
                if [[ -n "${name_space}" ]]; then
                    name_space_prefix="${name_space}_"
                fi
            fi

            image_name_tag="${image_name_tag%%@*}"
            new_image="$ALIYUN_REGISTRY/$ALIYUN_NAME_SPACE/${platform_prefix}${name_space_prefix}${image_name_tag}"

            echo "docker tag $image $new_image"
            if ! docker tag "$image" "$new_image"; then
                echo "::error::Tag failed: $image -> $new_image"
                push_failed=$((push_failed + 1))
                docker rmi "$image" || true
                continue
            fi

            # ============ push with retry ============
            echo "docker push $new_image"
            push_total=$((push_total + 1))
            push_success=false
            for attempt in 1 2 3; do
                echo "尝试第 ${attempt}/3 次 push..."
                if timeout 300 docker push "$new_image"; then
                    push_success=true
                    echo "::notice::Push 成功: $new_image"
                    break
                fi
                echo "::warning::第 ${attempt} 次 push 失败: $new_image"
                if [ "$attempt" -lt 3 ]; then
                    echo "等待 30 秒后重试..."
                    sleep 30
                fi
            done

            if [ "$push_success" = false ]; then
                echo "::error::Push 3次均失败: $new_image"
                push_failed=$((push_failed + 1))
            fi

            # 清理磁盘
            echo "开始清理磁盘空间"
            docker rmi "$image" || true
            docker rmi "$new_image" || true
            docker image prune -f || true
            echo "磁盘空间清理完毕"
            df -hT
            echo "=========================================="

        done < images.txt

        # ===================== 汇总结果 =====================
        echo "=========================================="
        echo "镜像总数: $push_total"
        echo "Pull 失败: $pull_failed"
        echo "Push 失败: $push_failed"
        echo "=========================================="
        df -hT

        if [ "$pull_failed" -gt 0 ] || [ "$push_failed" -gt 0 ]; then
            echo "::error::共有 $((pull_failed + push_failed)) 个镜像处理失败"
            exit 1
        fi
